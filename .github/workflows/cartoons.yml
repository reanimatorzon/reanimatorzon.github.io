name: Build cartoons preview
on:
  push:
    branches: [main]
    paths:
      - "cartoons-app/**"
      - ".github/workflows/cartoons.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cartoons-preview-publish
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: cartoons-app
        run: npm install --no-audit --no-fund
      - name: Build Remotion Player site
        working-directory: cartoons-app
        run: npm run build
      - name: Commit updated static preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/cartoons
          if git diff --cached --quiet; then
            echo "No preview changes"
          else
            git commit -m "chore: publish cartoons preview"
            git push
          fi
